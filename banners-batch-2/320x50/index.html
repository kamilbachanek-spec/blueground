<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ad.size" content="width=320,height=50">
  <title>Blueground – London Apartments | Sophia</title>
  <link rel="stylesheet" href="styles.css">
  <script>var clickTag = "https://www.theblueground.com/";</script>
</head>
<body>
  <div class="banner" role="banner">
    <a id="click-area" class="banner__click-area" href="javascript:void(0)" onclick="window.open(clickTag, '_blank')"></a>
    <div class="banner__content">
      <div class="banner__carousel-wrap">
        <div id="carousel" class="banner__carousel" aria-label="Apartment photos"></div>
      </div>
      <div class="banner__logo-wrap">
        <img id="logo" class="banner__logo" src="logo.svg" alt="Blueground" />
      </div>
      <h2 id="headline" class="banner__headline">Flexible lease. Fully furnished.</h2>
      <span id="cta" class="banner__cta">Explore now</span>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
