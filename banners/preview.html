<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banners Batch 1 – Preview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #233759;
      margin-bottom: 30px;
    }
    .banner-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }
    .banner-item {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex-shrink: 0;
      width: fit-content;
    }
    .banner-item h2 {
      margin-top: 0;
      color: #233759;
      font-size: 18px;
      margin-bottom: 15px;
    }
    .banner-item iframe {
      border: 2px solid #ddd;
      border-radius: 4px;
      display: block;
      background: white;
    }
    .size-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Banners Batch 1 – Preview</h1>

  <div class="banner-grid">
    <div class="banner-item">
      <div class="size-label">300×250</div>
      <h2>Medium Rectangle</h2>
      <iframe src="300x250/index.html" width="300" height="250" frameborder="0" scrolling="no"></iframe>
    </div>

    <div class="banner-item">
      <div class="size-label">336×280</div>
      <h2>Large Rectangle</h2>
      <iframe src="336x280/index.html" width="336" height="280" frameborder="0" scrolling="no"></iframe>
    </div>

    <div class="banner-item">
      <div class="size-label">300×600</div>
      <h2>Half Page</h2>
      <iframe src="300x600/index.html" width="300" height="600" frameborder="0" scrolling="no"></iframe>
    </div>

    <div class="banner-item">
      <div class="size-label">160×600</div>
      <h2>Wide Skyscraper</h2>
      <iframe src="160x600/index.html" width="160" height="600" frameborder="0" scrolling="no"></iframe>
    </div>

    <div class="banner-item">
      <div class="size-label">728×90</div>
      <h2>Leaderboard</h2>
      <iframe src="728x90/index.html" width="728" height="90" frameborder="0" scrolling="no"></iframe>
    </div>

    <div class="banner-item">
      <div class="size-label">320×100</div>
      <h2>Mobile Leaderboard</h2>
      <iframe src="320x100/index.html" width="320" height="100" frameborder="0" scrolling="no"></iframe>
    </div>

    <div class="banner-item">
      <div class="size-label">970×250</div>
      <h2>Billboard</h2>
      <iframe src="970x250/index.html" width="970" height="250" frameborder="0" scrolling="no"></iframe>
    </div>
  </div>
</body>
</html>
